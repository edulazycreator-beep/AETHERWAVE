name: Build AetherWave Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Compile Android APK
        run: |
          if [ -f "build.gradle" ]; then
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk AetherWave-Radio.apk
          elif [ -f "AetherWave-Android/build.gradle" ]; then
            cd AetherWave-Android
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk ../AetherWave-Radio.apk
          fi

      - name: 5. Upload File APK Siap Pasang
        uses: actions/upload-artifact@v4
        with:
          name: AetherWave-Android-APK
          path: AetherWave-Radio.apk
