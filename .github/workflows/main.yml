name: Build AetherWave Native Kotlin Compose APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 2. Compile Pure Native Kotlin + Jetpack Compose + ExoPlayer APK
        run: |
          rm -rf native_build
          mkdir -p native_build/app/src/main/java/id/aetherwave/radio
          cd native_build

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AetherWaveNative"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'id.aetherwave.radio'
              compileSdk 34

              defaultConfig {
                  applicationId "id.aetherwave.radio"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "2.0.0-NativeCompose"

                  vectorDrawables {
                      useSupportLibrary true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.10'
              }

              packaging {
                  resources {
                      excludes += '/META-INF/{AL2.0,LGPL2.1}'
                  }
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'

              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.foundation:foundation'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'

              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-session:1.2.1'
              implementation 'androidx.media3:media3-common:1.2.1'

              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="AetherWave Radio"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RadioPlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/id/aetherwave/radio/RadioPlaybackService.kt
          package id.aetherwave.radio

          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class RadioPlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val audioAttributes = AudioAttributes.Builder()
                      .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                      .setUsage(C.USAGE_MEDIA)
                      .build()

                  val player = ExoPlayer.Builder(this)
                      .setAudioAttributes(audioAttributes, true)
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_NETWORK)
                      .build()

                  mediaSession = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? {
                  return mediaSession
              }

              override fun onDestroy() {
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  super.onDestroy()
              }
          }
          EOF

