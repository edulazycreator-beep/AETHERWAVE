          @Composable
          fun GlassCard(
              primaryColor: Color,
              secondaryColor: Color,
              highlightBorder: Boolean = false,
              content: @Composable ColumnScope.() -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(26.dp))
                      .background(
                          Brush.linearGradient(
                              colors = if (highlightBorder) listOf(primaryColor.copy(alpha = 0.18f), secondaryColor.copy(alpha = 0.10f), Color(0xFF0F172A).copy(alpha = 0.85f))
                              else listOf(Color.White.copy(alpha = 0.10f), Color.White.copy(alpha = 0.04f))
                          )
                      )
                      .border(
                          width = 1.dp,
                          brush = Brush.linearGradient(
                              colors = if (highlightBorder) listOf(primaryColor.copy(alpha = 0.55f), Color.White.copy(alpha = 0.12f))
                              else listOf(Color.White.copy(alpha = 0.18f), Color.White.copy(alpha = 0.06f))
                          ),
                          shape = RoundedCornerShape(26.dp)
                      )
                      .padding(16.dp),
                  content = content
              )
          }

          @Composable
          fun NativeSpectrumVisualizer(
              isPlaying: Boolean,
              mode: Int,
              primaryColor: Color,
              secondaryColor: Color
          ) {
              val infiniteTransition = rememberInfiniteTransition(label = "spectrumPhase")
              val phase by infiniteTransition.animateFloat(
                  initialValue = 0f,
                  targetValue = 6.283185f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(durationMillis = if (isPlaying) 1100 else 3600, easing = LinearEasing),
                      repeatMode = RepeatMode.Restart
                  ),
                  label = "phaseAnim"
              )

              Canvas(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(82.dp)
                      .clip(RoundedCornerShape(16.dp))
                      .background(Color(0xFF090D16).copy(alpha = 0.65f))
                      .border(1.dp, Color.White.copy(alpha = 0.10f), RoundedCornerShape(16.dp))
                      .padding(horizontal = 10.dp, vertical = 8.dp)
              ) {
                  val bins = 32
                  if (mode == 0) {
                      val gap = 4.dp.toPx()
                      val barWidth = (size.width - gap * (bins - 1)) / bins
                      for (i in 0 until bins) {
                          val amp = if (isPlaying) (0.38f + sin(phase * 2f + i * 0.45f) * 0.28f + cos(phase * 3f - i * 0.6f) * 0.22f).coerceIn(0.10f, 0.96f) else 0.10f + sin(phase + i * 0.3f) * 0.03f
                          val barHeight = amp * size.height
                          val x = i * (barWidth + gap)
                          val y = (size.height - barHeight) / 2f
                          drawRoundRect(
                              brush = Brush.verticalGradient(listOf(primaryColor, secondaryColor)),
                              topLeft = Offset(x, y),
                              size = Size(barWidth.coerceAtLeast(2f), barHeight),
                              cornerRadius = CornerRadius(8f, 8f)
                          )
                      }
                  } else if (mode == 1) {
                      val path = Path()
                      val stepX = size.width / (bins - 1)
                      for (i in 0 until bins) {
                          val amp = if (isPlaying) sin(phase * 2f + i * 0.35f) * (size.height * 0.36f) else sin(phase + i * 0.25f) * (size.height * 0.06f)
                          val x = i * stepX
                          val y = size.height / 2f + amp
                          if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                      }
                      drawPath(path = path, brush = Brush.horizontalGradient(listOf(primaryColor, secondaryColor)), style = Stroke(width = 3.dp.toPx(), cap = StrokeCap.Round))
                  } else {
                      val cx = size.width / 2f
                      val cy = size.height / 2f
                      val baseR = size.height * 0.24f
                      drawCircle(brush = Brush.radialGradient(listOf(primaryColor.copy(alpha = 0.45f), Color.Transparent)), center = Offset(cx, cy), radius = baseR * 1.8f)
                      for (i in 0 until 24) {
                          val angle = (i.toFloat() / 24f) * 6.283185f + phase * 0.5f
                          val extra = if (isPlaying) (0.2f + sin(phase * 2f + i) * 0.18f) * size.height * 0.4f else 4f
                          drawLine(
                              color = if (i % 2 == 0) primaryColor else secondaryColor,
                              start = Offset(cx + cos(angle) * baseR, cy + sin(angle) * baseR),
                              end = Offset(cx + cos(angle) * (baseR + extra), cy + sin(angle) * (baseR + extra)),
                              strokeWidth = 2.5.dp.toPx(),
                              cap = StrokeCap.Round
                          )
                      }
                  }
              }
          }

          @Composable
          fun InteractiveWorldMapCanvas(
              selectedCode: String,
              accentColor: Color,
              onSelectCountry: (String) -> Unit
          ) {
              Canvas(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(155.dp)
                      .clip(RoundedCornerShape(18.dp))
                      .background(Color(0xFF060911))
                      .border(1.dp, Color.White.copy(alpha = 0.10f), RoundedCornerShape(18.dp))
                      .pointerInput(Unit) {
                          detectTapGestures { tapOffset ->
                              val normX = tapOffset.x / size.width
                              val normY = tapOffset.y / size.height
                              val nearest = GLOBAL_COUNTRIES.minByOrNull { c ->
                                  val dx = c.mapX - normX
                                  val dy = c.mapY - normY
                                  dx * dx + dy * dy
                              }
                              if (nearest != null) onSelectCountry(nearest.code)
                          }
                      }
              ) {
                  for (c in 1 until 8) {
                      val x = (size.width / 8) * c
                      drawLine(Color.White.copy(alpha = 0.05f), Offset(x, 0f), Offset(x, size.height), 1f)
                  }
                  for (r in 1 until 4) {
                      val y = (size.height / 4) * r
                      drawLine(Color.White.copy(alpha = 0.05f), Offset(0f, y), Offset(size.width, y), 1f)
                  }
                  GLOBAL_COUNTRIES.forEach { node ->
                      val px = node.mapX * size.width
                      val py = node.mapY * size.height
                      val isSelected = node.code == selectedCode
                      if (isSelected) {
                          drawCircle(accentColor.copy(alpha = 0.28f), 16.dp.toPx(), Offset(px, py))
                      }
                      drawCircle(if (isSelected) accentColor else Color.White.copy(alpha = 0.75f), if (isSelected) 6.dp.toPx() else 4.dp.toPx(), Offset(px, py))
                  }
              }
          }
          EOF

          # Rapikan indentasi spasi YAML pada setiap file yang dibuat
          for f in settings.gradle gradle.properties build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/id/aetherwave/radio/RadioPlaybackService.kt app/src/main/java/id/aetherwave/radio/MainActivity.kt; do
            sed -i 's/^          //' "$f"
          done

          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AetherWave-Native-Compose.apk

      - name: 3. Upload Native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherWave-Native-Compose-APK
          path: AetherWave-Native-Compose.apk
